site:
  name: EV Street Co
  # Served from GitHub Pages on the custom domain evstreetco.com
  # (public/CNAME + the DNS records in the README).
  site: 'https://evstreetco.com'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: false

# Default SEO metadata
metadata:
  title:
    default: EV Street Co | Curbside EV Charging in Chicago
    template: '%s | EV Street Co'
  description: 'EV Street Co installs a curbside Level 2 EV charging station at your Chicago property. You own it, you set the rate, and you keep what it earns.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: EV Street Co
    images:
      - url: '~/assets/images/og-image.png'
        width: 1200
        height: 630
    type: website
  twitter:
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: false
    postsPerPage: 6

    post:
      isEnabled: false
      permalink: '/%slug%'
      robots:
        index: false

    list:
      isEnabled: false
      pathname: 'blog'
      robots:
        index: false

    category:
      isEnabled: false
      pathname: 'category'
      robots:
        index: false

    tag:
      isEnabled: false
      pathname: 'tag'
      robots:
        index: false

    isRelatedPostsEnabled: false
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null

ui:
  theme: 'light:only'
